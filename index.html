ex;align-items:center;gap:10px;margin-top:15px}.identity-line .dash{height:1px;width:30px;background:#ad8d7d}.handle{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.025em;color:#8b7164}.actions{display:grid;grid-template-columns:1fr 54px;gap:8px;margin-top:24px;direction:rtl}.save,.share{min-height:53px;display:flex;justify-content:center;align-items:center;gap:9px;border-radius:3px;transition:transform .2s,background .2s,border-color .2s;color:inherit;cursor:pointer}.save{background:var(--dark);color:#f9f4ed;border:1px solid var(--dark);font-size:13px;font-weight:800}.save:hover{background:#763e39;border-color:#763e39;transform:translateY(-2px)}.share{background:transparent;color:#3e302b;border:1px solid #bcaea2}.share:hover{border-color:#8e423d;color:#8e423d}.save svg,.share svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.status{text-align:center;color:var(--wine);font-size:11px}.status:not(:empty){padding-top:12px}.section{display:flex;align-items:center;gap:10px;margin:29px 0 14px}.section h2{font-size:12px;margin:0;white-space:nowrap;font-weight:700;color:#4b403b}.section:after{content:'';height:1px;background:var(--line);flex:1}.section span{direction:ltr;order:3;font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#9c8b80}.contact{display:flex;align-items:center;gap:12px;border:1px solid #d9cfc3;background:#fbf7f0;padding:12px;min-height:66px;transition:background .2s,border-color .2s,transform .2s}.contact:hover,.contact:focus-visible{background:#fffdf9;border-color:#a88370;transform:translateY(-2px)}.contact-icon{display:grid;place-items:center;width:41px;height:41px;flex:none;background:#ede3d8;color:#7f4640}.contact-icon svg,.social-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.contact-text{flex:1}.contact-label{display:block;font-size:11px;font-weight:700;color:#66554c}.contact-number{display:block;direction:ltr;text-align:right;margin-top:3px;font:600 15px 'Space Grotesk',sans-serif;color:#302923;letter-spacing:.025em}.arrow{direction:ltr;color:#a57764;font-size:19px;line-height:1}.socials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));direction:ltr;gap:7px;margin-top:7px}.social{display:flex;flex-direction:column;align-items:flex-start;gap:17px;min-height:119px;padding:12px;background:#ece4da;border:1px solid #ddd0c4;transition:background .2s,border-color .2s,transform .2s}.social:hover,.social:focus-visible{background:#fdf8f1;border-color:#ae8873;transform:translateY(-3px)}.social-top{display:flex;align-items:center;justify-content:space-between;width:100%;color:#824740}.social-top .arrow{font-size:15px}.social-name{display:block;color:#342c28;font:700 12px 'Space Grotesk',sans-serif}.social-user{display:block;margin-top:3px;color:#8d7a6e;font:500 9px 'IBM Plex Mono',monospace;white-space:nowrap}.save:active,.share:active,.contact:active,.social:active{transform:scale(.98)}.foot{display:flex;justify-content:space-between;direction:ltr;margin:18px 4px 0;font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#97877b}.foot span:last-child{color:#9c6b5d}a:focus-visible,button:focus-visible{outline:2px solid #883c38;outline-offset:3px}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes photo-in{from{opacity:.8;transform:scale(1.025)}to{opacity:1;transform:scale(1)}}@media(max-width:380px){body{padding:19px 12px 35px}.content{padding:21px 16px 20px}.hero{padding:8px 8px 0}.name{font-size:clamp(48px,13vw,60px)}.social{padding:11px 8px;min-height:113px}.social-name{font-size:11px}.social-user{font-size:9px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Full-bleed portrait with layered, liquid-glass surfaces */
:root{color-scheme:dark;--ink:#fffaf4;--muted:#e5d9cf;--line:#ffffff45;--wine:#f2d4ca;--dark:#24201fc9}
html{background:#151311;min-height:100%}body{position:relative;isolation:isolate;background:#151311;min-height:100vh;padding:25px 16px 34px;color:#fffaf5}
.wallpaper{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#201a16}.wallpaper img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 35%}.wallpaper:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,12,10,.28),rgba(15,12,10,.08) 28%,rgba(14,12,11,.40) 60%,rgba(12,10,9,.72) 100%)}
main{position:relative;z-index:1;min-height:calc(100vh - 59px);min-height:calc(100dvh - 59px);display:flex;flex-direction:column;justify-content:flex-end;max-width:464px}
.top{margin:0 3px auto;padding-bottom:24px}.top-name{color:#fffaf5;text-shadow:0 1px 12px #0009}.top-name span{color:#f2c8b9}.top-tag{color:#f4e9df;text-shadow:0 1px 10px #000}
.card{position:relative;overflow:hidden;border-radius:26px;border:1px solid rgba(255,255,255,.34);background:linear-gradient(130deg,rgba(255,255,255,.21),rgba(37,29,26,.33) 38%,rgba(24,19,18,.49));box-shadow:0 24px 65px #0006,inset 0 1px 0 #ffffff8a,inset 0 -1px 0 #ffffff1a;-webkit-backdrop-filter:blur(21px) saturate(145%);backdrop-filter:blur(21px) saturate(145%)}
.card:before{content:'';position:absolute;inset:1px 1px auto;height:95px;pointer-events:none;border-radius:25px 25px 60% 30%;background:linear-gradient(170deg,rgba(255,255,255,.18),transparent 70%)}
.content{position:relative;z-index:1;padding:23px 23px 24px}.name{color:#fffaf5;text-shadow:0 2px 18px #0007}.name em,.name-dot{color:#f4d4c9}.identity-line .dash{background:#ffffff9c}.handle{color:#f7e7dd;text-shadow:0 1px 8px #000a}
.actions{margin-top:20px}.save,.share{border-radius:15px;min-height:52px}.save{background:rgba(255,250,244,.89);color:#251b18;border:1px solid #ffffffa8;box-shadow:inset 0 1px 0 #fff,0 5px 18px #0002}.save:hover{background:#fffaf3;color:#251b18;border-color:#fff}.share{background:rgba(255,255,255,.13);color:#fffaf5;border:1px solid #ffffff59;box-shadow:inset 0 1px 0 #ffffff40}.share:hover{background:#ffffff26;border-color:#fff9;color:white}
.section{margin:25px 0 12px}.section h2{color:#fffaf5;text-shadow:0 1px 7px #0007}.section:after{background:#ffffff5c}.section span{color:#f4e3d8}
.contact{border-radius:15px;border:1px solid #ffffff52;background:linear-gradient(130deg,#ffffff2a,#ffffff0d);box-shadow:inset 0 1px 0 #ffffff42;min-height:64px}.contact:hover,.contact:focus-visible{background:#ffffff30;border-color:#ffffffa0}.contact-icon{border-radius:12px;color:#fff7ee;background:#ffffff24;border:1px solid #ffffff30}.contact-label{color:#f6e6db}.contact-number{color:#fffaf5}.arrow{color:#f8e1d5}
.socials{gap:8px;margin-top:8px}.social{border-radius:15px;border:1px solid #ffffff52;background:linear-gradient(140deg,#ffffff28,#ffffff0c);box-shadow:inset 0 1px 0 #ffffff3a;min-height:108px;gap:13px}.social:hover,.social:focus-visible{background:#ffffff30;border-color:#ffffffa0}.social-top{color:#fff5ee}.social-name{color:#fffaf5}.social-user{color:#f2ded2}
.foot{color:#f3e4dc;text-shadow:0 1px 10px #000;margin-top:14px}.foot span:last-child{color:#f2d9cb}a:focus-visible,button:focus-visible{outline:2px solid white;outline-offset:3px}
@media(max-width:380px){body{padding:18px 12px 25px}main{min-height:calc(100vh - 43px);min-height:calc(100dvh - 43px)}.content{padding:20px 16px}.top{padding-bottom:18px}.social{min-height:103px}.card{border-radius:22px}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card{background:rgba(37,30,27,.88)}}


/* Reserve the upper part of the viewport for the portrait, so the glass panel does not cover the face. */
main{justify-content:flex-start}.top{margin:0 3px;padding-bottom:0}.face-space{flex:0 0 clamp(370px,61svh,600px)}
.wallpaper img{object-position:50% 35%}
@media(min-aspect-ratio:1/1){.wallpaper img{object-fit:contain;object-position:center top}.face-space{flex-basis:clamp(330px,64svh,580px)}}
@media(max-width:380px){.top{padding-bottom:0}.face-space{flex-basis:clamp(345px,61svh,560px)}}


/* Polished liquid-glass controls */
.actions{grid-template-columns:minmax(0,1fr) 54px;gap:10px}
